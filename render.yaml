services:
  # 1. Backend REST API Service (Node.js + SQLite3)
  - type: web
    name: chronopulse-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # 2. Frontend Web App Service (React Vite Static Site)
  - type: web
    name: chronopulse-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
